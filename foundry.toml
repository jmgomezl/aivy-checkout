[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Hedera testnet (EVM-equivalent). Fill RPC + key in .env before deploying.
# JSON-RPC relay: https://testnet.hashio.io/api  (community relay)
[rpc_endpoints]
hedera_testnet = "${HEDERA_RPC_URL}"
